# Radicale configuration. Only the settings that differ from Radicale's own
# defaults are listed here; the upstream annotated reference lives at
# https://github.com/Kozea/Radicale/blob/master/config.

[server]
hosts = 0.0.0.0:5232

[auth]
# Radicale performs no authentication of its own: OpenCloud's proxy already
# validated the OIDC session or app token and passes the resolved username in
# X-Remote-User, which is trusted unconditionally. This is only safe because
# the container sits on the backend network and is never published or routed
# through Caddy — the proxy is the sole path in.
type = http_x_remote_user

[storage]
# Create a calendar and an address book the first time a user authenticates.
# Without this a new user has no collections at all, and most CalDAV clients
# offer no way to create one, so they would just see an empty account.
predefined_collections = {
    "def-addressbook": {
       "D:displayname": "Personal Address Book",
       "tag": "VADDRESSBOOK"
    },
    "def-calendar": {
       "C:supported-calendar-component-set": "VEVENT,VJOURNAL,VTODO",
       "D:displayname": "Personal Calendar",
       "tag": "VCALENDAR"
    }
  }

[web]
# No web UI. Radicale's own interface does its own password prompt, which would
# require exposing an unauthenticated route past the proxy — the one thing this
# setup relies on not existing.
type = none
