# Extra proxy routes for the Radicale CalDAV/CardDAV server.
#
# OpenCloud's proxy is the authentication boundary: it validates the OIDC
# session or app token, then forwards to Radicale with the resolved username in
# X-Remote-User. Radicale itself has no authentication of its own (see
# radicale.conf) and is only reachable on the backend network.
#
# `skip_x_access_token` stops the proxy from also injecting the CS3 access
# token; Radicale has no use for it and it would only bloat every request.
# `X-Script-Name` tells Radicale which path prefix it is mounted under, so the
# hrefs in its PROPFIND responses are absolute URLs the client can follow.
#
# Copied into ./config by init.sh. Edits only take effect after a re-run.
additional_policies:
  - name: default
    routes:
      - endpoint: /caldav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /.well-known/caldav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /caldav
      - endpoint: /carddav/
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
      - endpoint: /.well-known/carddav
        backend: http://radicale:5232
        remote_user_header: X-Remote-User
        skip_x_access_token: true
        additional_headers:
          - X-Script-Name: /carddav
