services:
  dozzle:
    container_name: dozzle
    restart: unless-stopped
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Holds users.yml (bcrypt password hashes) for the simple auth provider.
      # Gitignored — never commit it.
      - ./data:/data
    ports:
      - 8081:8080
    environment:
      # Container actions (stop, start, restart). See https://dozzle.dev/guide/actions
      - DOZZLE_ENABLE_ACTIONS=true
      # Shell access into containers. See https://dozzle.dev/guide/shell
      # NOTE: with the docker socket mounted, this is effectively a root shell in
      # any container on the host — the login below is the only thing gating it.
      - DOZZLE_ENABLE_SHELL=true
      # Authentication. Required: this port is published on the LAN (not behind
      # Caddy/Authentik like the other stacks), so without it the shell above is
      # reachable by any device on the network with no credentials.
      - DOZZLE_AUTH_PROVIDER=simple
      # Re-prompt for login rather than keeping a session open indefinitely.
      - DOZZLE_AUTH_TTL=12h
