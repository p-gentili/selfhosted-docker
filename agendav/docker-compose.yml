services:
  agendav:
    # AgenDAV publishes no image to any registry, so this builds upstream's own
    # production Dockerfile (php:8.5-apache, document root /app/public).
    #
    # The context is a shallow clone of a pinned tag that init.sh puts in
    # ./src, rather than a git URL context, because upstream's production
    # Dockerfile is broken in two ways and init.sh has to repair the checkout
    # before building:
    #
    #   1. It runs `chmod -R 750 /app/var`, but var/.gitkeep was deleted in
    #      ae1c3504 without updating this Dockerfile, so the directory is
    #      absent from a clean checkout and the build fails outright.
    #   2. It runs three of the four npm asset steps, skipping `build:copy` —
    #      the one that copies the icon fonts out of node_modules — so the
    #      build succeeds but every icon in the UI renders broken.
    #
    # init.sh recreates the directory and inserts the missing step, both
    # guarded so an upstream change becomes a loud failure rather than a
    # silent regression. Everything else is upstream's Dockerfile as shipped.
    #
    # Watchtower only updates registry images and will skip this container:
    # upgrading means bumping AGENDAV_VERSION in init.sh and re-running it.
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: agendav
    restart: unless-stopped
    environment:
      # Upstream's Dockerfile already defaults to prod; set explicitly so a
      # future base-image change can't silently turn stack traces back on.
      AGENDAV_ENVIRONMENT: prod
    volumes:
      # Rendered from settings.template.php by init.sh. Carries the CSRF secret
      # and the session encryption key, so it is gitignored and mode 640.
      - ./settings.php:/app/config/settings.php:ro
      # SQLite store: sessions, user preferences, subscriptions.
      - ./data:/app/database
      # Twig cache, logs and var/session.key. The image ships this owned by
      # www-data; a bind mount masks that, so init.sh restores the ownership.
      - ./var:/app/var
    # frontend only. AgenDAV reaches the CalDAV server as http://opencloud:9200
    # over this same network — the OpenCloud proxy is the authentication
    # boundary and does the Basic-auth check. The opencloud stack's `backend`
    # network (where Radicale lives) is stack-local and deliberately not joined:
    # Radicale trusts X-Remote-User blindly and must stay reachable only via the
    # proxy.
    networks:
      - frontend

networks:
  frontend:
    name: frontend
    external: true
